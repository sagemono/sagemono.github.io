---
layout: default
---
<article class="post nc_prose">
  <a class="post_back nc_rise" href="{{ '/' | relative_url }}">All write-ups</a>
  <h1>{{ page.title }}</h1>
  <div class="post_meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {%- for tag in page.tags %}
    <span class="nc_chip nc_soft">{{ tag }}</span>
    {%- endfor %}
  </div>
{{ content }}
</article>
